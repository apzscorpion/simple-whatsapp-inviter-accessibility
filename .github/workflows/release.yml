name: Release APK
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter test
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"; fi
      # build-number must grow for Android to accept the APK as an update.
      # One small APK per phone type instead of one big APK carrying all of them.
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --build-name "${GITHUB_REF_NAME#v}" --build-number ${{ github.run_number }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: inviter
      - run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "whatsapp-inviter-${GITHUB_REF_NAME}.apk"
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "whatsapp-inviter-${GITHUB_REF_NAME}-old-phones.apk"
      - uses: softprops/action-gh-release@v2
        with:
          body: "Install **whatsapp-inviter-${{ github.ref_name }}.apk**. Only if it says the app isn't compatible, use the *-old-phones* one."
          files: whatsapp-inviter-${{ github.ref_name }}*.apk
