name: Release APK
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter test
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk whatsapp-inviter-${{ github.ref_name }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: whatsapp-inviter-${{ github.ref_name }}.apk
